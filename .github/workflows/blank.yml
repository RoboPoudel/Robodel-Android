name: Build Robodel APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the Robodel project from the zip
        run: |
          mkdir app
          unzip -q Robodel_Android_8.65.zip -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The GitHub runner already contains the Android SDK, so no extra SDK step is needed.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install packages
        working-directory: app
        run: npm ci

      - name: Copy the Robodel page into the app
        working-directory: app
        run: node scripts/prepare.js

      - name: Sync the Android project
        working-directory: app
        run: npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: Robodel-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
